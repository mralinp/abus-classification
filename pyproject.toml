[project]
name = "abus-classification_mralinp"
version = "0.0.1"
authors = [
  { name="Ali Naderi Parizi", email="alinaderiparizi@gmail.com" },
]
description = "A small example package"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

# Runtime dependencies of the `abus_classification` package itself.
dependencies = [
    "gdown>=5.2",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "opencv-python>=4.10",
    "openpyxl>=3.1",       # pandas.read_excel backend for ABUS labels.xlsx
    "pandas>=2.2",
    "pynrrd>=1.1",
    "scikit-image>=0.24",
    "scipy>=1.14",
    "tdsc-abus2023-pytorch>=0.1.10",
    "torch>=2.5",
    "torchvision>=0.20",
    "trimesh>=4.5",
]

[project.urls]
Homepage = "https://github.com/mralinp/abus-classification"
Issues = "https://github.com/mralinp/abus-classification/issues"

[dependency-groups]
dev = [
    "pytest>=8.3",
]
# Extra packages the notebooks/ use on top of the library.
notebooks = [
    "albumentations>=2.0",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
    "pillow>=11.0",
    "scikit-learn>=1.5",
    "tqdm>=4.67",
]

[tool.uv]
# Resolve only for macOS, so the lock file never pulls the linux-only
# nvidia-cu* / triton wheels that PyTorch depends on for CUDA builds.
# Drop this line (and add a CPU index for torch) if the project needs to
# run on Linux again.
environments = ["sys_platform == 'darwin'"]
default-groups = ["dev", "notebooks"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["abus_classification"]
